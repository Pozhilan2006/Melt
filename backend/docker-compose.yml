version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: melt_postgis_db
    environment:
      POSTGRES_USER: melt_user
      POSTGRES_PASSWORD: melt_password
      POSTGRES_DB: melt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melt_user -d melt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melt_fastapi_backend
    environment:
      DATABASE_URL: postgresql://melt_user:melt_password@db:5432/melt_db
      JWT_SECRET_KEY: super_secret_jwt_key_replace_in_production_melt_2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
